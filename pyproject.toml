[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "px-calculator"
version = "0.1.0"
description = "Beautiful Package"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
openai = ["openai>=1.30"]          # also covers ollama and openai-compatible
anthropic = ["anthropic>=0.40"]
all = ["openai>=1.30", "anthropic>=0.40"]

[project.scripts]
px-calculator = "px_calculator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
